<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EffiSol Solar Proposal Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0f19;
      --card-bg: rgba(23, 32, 54, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #06b6d4;
      --accent: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 950px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--card-border);
    }

    .brand h1 { font-family: 'Space Grotesk', sans-serif; font-size: 1.6rem; }
    .brand h1 span { color: var(--primary); }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      font-size: 0.85rem;
      border: 1px solid var(--card-border);
    }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warning); }
    .dot.online { background: var(--success); box-shadow: 0 0 10px var(--success); }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
    }

    .card h2 { font-size: 1.1rem; margin-bottom: 1rem; color: var(--primary); }

    .grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
    @media (min-width: 768px) { .grid { grid-template-columns: 1fr 1fr; } }

    .form-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
    label { font-size: 0.82rem; color: var(--text-muted); font-weight: 600; }
    input, select {
      width: 100%;
      background: rgba(11, 15, 25, 0.7);
      border: 1px solid var(--card-border);
      padding: 0.75rem 1rem;
      border-radius: 10px;
      color: var(--text);
      outline: none;
    }
    input:focus, select:focus { border-color: var(--primary); }

    .btn {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border: none;
      padding: 0.85rem 1.5rem;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }

    .results-panel { display: flex; flex-direction: column; gap: 1rem; }
    .stat-box {
      background: rgba(11, 15, 25, 0.5);
      border: 1px solid var(--card-border);
      padding: 1rem;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stat-label { font-size: 0.85rem; color: var(--text-muted); }
    .stat-val { font-size: 1.1rem; font-weight: 700; color: var(--success); }

    .api-config {
      display: flex;
      gap: 0.5rem;
    }
    .api-config input { flex: 1; }
    .api-config button { width: auto; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>⚡ EffiSol <span>Proposal Generator</span></h1>
      </div>
      <div class="status-badge">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Checking Backend...</span>
      </div>
    </header>

    <!-- Render API Config Box -->
    <div class="card">
      <h2>🌐 Render Backend URL Connection</h2>
      <div class="api-config">
        <input type="url" id="renderUrlInput" placeholder="Enter your Render Backend URL (e.g. https://effisol-backend.onrender.com)">
        <button class="btn" id="saveUrlBtn">Connect Backend</button>
      </div>
    </div>

    <div class="grid">
      <!-- Input Form -->
      <div class="card">
        <h2>📋 System Specifications</h2>
        <form id="proposalForm">
          <div class="form-group">
            <label for="customerName">Customer Name</label>
            <input type="text" id="customerName" placeholder="e.g. Mr. Rama Krishna" required>
          </div>
          <div class="form-group">
            <label for="systemSizeKw">System Size (kW)</label>
            <input type="number" id="systemSizeKw" value="5.5" step="0.1" required>
          </div>
          <div class="form-group">
            <label for="panelType">Solar Panel Model</label>
            <select id="panelType">
              <option value="Mono PERC 540W">Mono PERC 540W High Efficiency</option>
              <option value="TOPCon 575W Bifacial">TOPCon 575W Bifacial</option>
              <option value="Polycrystalline 330W">Polycrystalline 330W Standard</option>
            </select>
          </div>
          <div class="form-group">
            <label for="inverterType">Inverter Rating</label>
            <select id="inverterType">
              <option value="5kW Hybrid Inverter">5kW Hybrid Inverter</option>
              <option value="8kW On-Grid Inverter">8kW On-Grid Inverter</option>
              <option value="10kW 3-Phase Inverter">10kW 3-Phase Inverter</option>
            </select>
          </div>
          <div class="form-group">
            <label for="pricePerWatt">Price Per Watt (₹)</label>
            <input type="number" id="pricePerWatt" value="55" required>
          </div>
          <button type="submit" class="btn">🚀 Calculate Proposal via Backend</button>
        </form>
      </div>

      <!-- Live Calculated Output (Recieved from Render Backend) -->
      <div class="card">
        <h2>📊 Calculation Output (Calculated Privately on Server)</h2>
        <div class="results-panel" id="resultsPanel">
          <p style="color: var(--text-muted);">Fill out the form and submit to calculate values from your secure Render backend API.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Load stored Render URL or default
    let BACKEND_URL = localStorage.getItem('effisol_backend_url') || 'https://effisol-backend.onrender.com';
    const renderUrlInput = document.getElementById('renderUrlInput');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    renderUrlInput.value = BACKEND_URL;

    document.getElementById('saveUrlBtn').addEventListener('click', () => {
      BACKEND_URL = renderUrlInput.value.trim().replace(/\/$/, '');
      localStorage.setItem('effisol_backend_url', BACKEND_URL);
      checkBackendHealth();
    });

    async function checkBackendHealth() {
      statusText.textContent = 'Connecting...';
      statusDot.className = 'dot';
      try {
        const res = await fetch(`${BACKEND_URL}/api/health`);
        const data = await res.json();
        if (data.status === 'ok') {
          statusText.textContent = 'Backend Online (Render)';
          statusDot.className = 'dot online';
        }
      } catch (err) {
        statusText.textContent = 'Backend Offline';
        statusDot.className = 'dot';
      }
    }

    document.getElementById('proposalForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const resultsPanel = document.getElementById('resultsPanel');
      resultsPanel.innerHTML = '<p style="color: var(--primary);">Calculating on secure Render backend server...</p>';

      const payload = {
        customerName: document.getElementById('customerName').value,
        systemSizeKw: parseFloat(document.getElementById('systemSizeKw').value),
        panelType: document.getElementById('panelType').value,
        inverterType: document.getElementById('inverterType').value,
        pricePerWatt: parseFloat(document.getElementById('pricePerWatt').value)
      };

      try {
        const res = await fetch(`${BACKEND_URL}/api/calculate-proposal`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (data.success) {
          const fin = data.proposalData.financials;
          resultsPanel.innerHTML = `
            <div class="stat-box">
              <span class="stat-label">Gross System Cost</span>
              <span class="stat-val">₹${fin.grossTotal.toLocaleString('en-IN')}</span>
            </div>
            <div class="stat-box">
              <span class="stat-label">Govt. Solar Subsidy</span>
              <span class="stat-val" style="color: #10b981;">- ₹${fin.subsidyAmount.toLocaleString('en-IN')}</span>
            </div>
            <div class="stat-box">
              <span class="stat-label">Net Customer Payable</span>
              <span class="stat-val" style="color: #06b6d4;">₹${fin.finalPayable.toLocaleString('en-IN')}</span>
            </div>
            <div class="stat-box">
              <span class="stat-label">Est. Generation / Year</span>
              <span class="stat-val">${fin.estimatedAnnualGenKwh} kWh</span>
            </div>
            <div class="stat-box">
              <span class="stat-label">Est. Annual Savings</span>
              <span class="stat-val">₹${fin.estimatedAnnualSavingsInr.toLocaleString('en-IN')}</span>
            </div>
            <div class="stat-box">
              <span class="stat-label">Payback Period</span>
              <span class="stat-val">${fin.paybackYears} Years</span>
            </div>
          `;
        } else {
          resultsPanel.innerHTML = `<p style="color: #ef4444;">Server error: ${data.message}</p>`;
        }
      } catch (err) {
        resultsPanel.innerHTML = `<p style="color: #ef4444;">Failed to connect to Render backend at <code>${BACKEND_URL}</code>. Check your backend URL.</p>`;
      }
    });

    checkBackendHealth();
  </script>
</body>
</html>
